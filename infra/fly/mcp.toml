# InvoiceDesk remote MCP server (Streamable HTTP, stateless, OAuth Protected Resource Metadata).
#   fly deploy . --config infra/fly/mcp.toml           (from the repo root)
# It calls the API's agent facade over Fly's private network with short-lived service JWTs
# signed with AGENT_JWT_SECRET (a secret shared with invoicedesk-api). Secrets: see README.md.
app = "invoicedesk-mcp"
primary_region = "iad"
kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]
  dockerfile = "../docker/python.Dockerfile"

[env]
  INVOICEDESK_MODE = "live"
  MCP_HOST = "::"
  MCP_PORT = "8100"
  MCP_RESOURCE_URL = "https://invoicedesk-mcp.fly.dev/mcp"   # RFC 8707 audience; must match tokens
  MCP_RESOURCE_NAME = "InvoiceDesk"
  MCP_ALLOWED_HOSTS = "invoicedesk-mcp.fly.dev"
  MCP_API_BASE_URL = "http://invoicedesk-api.internal:8000/api/v1"

[processes]
  app = "invoicedesk-mcp"

[http_service]
  internal_port = 8100
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  processes = ["app"]
