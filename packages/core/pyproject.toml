[project]
name = "invoicedesk"
version = "0.1.0"
description = "InvoiceDesk core library: contracts, money, status machine, rules, extraction, pipeline"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic>=2.10",
  "pydantic-settings>=2.7",
  "pyyaml>=6.0",
  "psycopg[binary,pool]>=3.2",
  "sqlalchemy>=2.0",
  "anthropic>=2.3",
  "httpx>=0.28",
  "pymupdf>=1.25",
  "pillow>=11.0",
  "pillow-heif>=0.21",
  "imagehash>=4.3",
  "opencv-python-headless>=4.10",
  "numpy>=2.0",
  "scipy>=1.14",
  "scikit-learn>=1.6",
  "rapidfuzz>=3.10",
  "rapidocr-onnxruntime>=1.2.3",
  "langgraph>=1.0",
  "langgraph-checkpoint-postgres>=3.0",
  "opentelemetry-api>=1.29",
  "opentelemetry-sdk>=1.29",
  "opentelemetry-exporter-otlp-proto-http>=1.29",
  "jinja2>=3.1",
  "tenacity>=9.0",
]

[project.optional-dependencies]
doctr = ["python-doctr[torch]>=0.10"]
azure = ["azure-ai-documentintelligence>=1.0"]

[project.scripts]
invoicedesk = "invoicedesk.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["invoicedesk"]
