[project]
name = "invoicedesk-evals"
version = "0.1.0"
description = "InvoiceDesk eval harness, metrics, matrix runner, report card"
requires-python = ">=3.12,<3.13"
dependencies = [
  "invoicedesk",
  "invoicedesk-data",
  "numpy>=2.0",
  "scipy>=1.14",
  "matplotlib>=3.9",
  "jinja2>=3.1",
  "playwright==1.63.0",
]

[project.scripts]
invoicedesk-eval = "invoicedesk_evals.runner:main"

[tool.uv.sources]
invoicedesk = { workspace = true }
invoicedesk-data = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["invoicedesk_evals"]
