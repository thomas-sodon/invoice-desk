[project]
name = "invoicedesk-data"
version = "0.1.0"
description = "InvoiceDesk synthetic data: business-universe seed, invoice generator, adversarial set, demo batch"
requires-python = ">=3.12,<3.13"
dependencies = [
  "invoicedesk",
  "faker>=33.0",
  "jinja2>=3.1",
  # Pinned to match the preinstalled Chromium build (/opt/pw-browsers/chromium-1243).
  "playwright==1.63.0",
  "opencv-python-headless>=4.10",
  "pillow>=11.0",
  "numpy>=2.0",
  "huggingface-hub>=0.27",
]

[project.optional-dependencies]
augraphy = ["augraphy>=8.2"]

[project.scripts]
invoicedesk-data = "invoicedesk_data.cli:main"

[tool.uv.sources]
invoicedesk = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["invoicedesk_data"]
