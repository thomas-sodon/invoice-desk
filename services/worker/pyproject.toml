[project]
name = "invoicedesk-worker"
version = "0.1.0"
description = "InvoiceDesk worker: runs the LangGraph document pipeline off the Postgres job queue"
requires-python = ">=3.12,<3.13"
dependencies = ["invoicedesk"]

[project.scripts]
invoicedesk-worker = "invoicedesk_worker.main:main"

[tool.uv.sources]
invoicedesk = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["invoicedesk_worker"]
