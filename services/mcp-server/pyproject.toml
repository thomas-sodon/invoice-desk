[project]
name = "invoicedesk-mcp"
version = "0.1.0"
description = "InvoiceDesk remote MCP server (3 tools, stateless, Streamable HTTP, OAuth PRM)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "invoicedesk",
  "mcp>=2.3",  # MRTR input_required, tools/list cache hints, 2026-07-28 transport
  "httpx>=0.28",
  "pyjwt[crypto]>=2.10",
  "starlette>=0.41",
  "uvicorn[standard]>=0.32",
]

[project.scripts]
invoicedesk-mcp = "invoicedesk_mcp.server:main"

[tool.uv.sources]
invoicedesk = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["invoicedesk_mcp"]
