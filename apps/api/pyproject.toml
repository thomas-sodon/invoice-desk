[project]
name = "invoicedesk-api"
version = "0.1.0"
description = "InvoiceDesk FastAPI gateway"
requires-python = ">=3.12,<3.13"
dependencies = [
  "invoicedesk",
  # demo files, OracleLLM and seed_database (imported lazily for the offline demo)
  "invoicedesk-data",
  "httpx>=0.28",
  "pymupdf>=1.25",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "python-multipart>=0.0.18",
  "pyjwt[crypto]>=2.10",
  "itsdangerous>=2.2",
  "email-validator>=2.2",
  "sse-starlette>=2.1",
]

[tool.uv.sources]
invoicedesk = { workspace = true }
invoicedesk-data = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["invoicedesk_api"]
